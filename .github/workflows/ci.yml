name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: JVM and APK smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager "build-tools;37.0.0" "platforms;android-36"

      - name: Run JVM smoke test
        run: bash tests/smoke.sh

      - name: Test malformed binary manifest handling
        run: python3 tests/manifest-safety.py

      - name: Run framework lifecycle and event loop tests
        run: bash tests/framework-smoke.sh

      - name: Run APK inspection smoke test
        run: bash tests/apk-inspect-smoke.sh

  wayland-backend:
    name: Native Wayland compile and headless GUI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install GTK4 and a headless Wayland compositor
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config weston
      - name: Compile native Wayland backend
        run: bash scripts/build-wayland.sh
      - name: Verify Java click and repaint protocol
        run: bash tests/gui-protocol-smoke.sh
      - name: Verify Wayland window under Weston headless
        run: bash tests/wayland-headless.sh
