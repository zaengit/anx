name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: JVM and APK smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager "build-tools;37.0.0" "platforms;android-36"

      - name: Run JVM smoke test
        run: bash tests/smoke.sh

      - name: Test fail-closed Bubblewrap command construction
        run: python3 tests/sandbox-unit.py

      - name: Verify kernel rlimits for experimental sandbox children
        run: python3 tests/sandbox-limits.py

      - name: Validate opt-in cgroup v2 quotas and fail-closed cleanup (mock kernel)
        run: python3 tests/cgroup-unit.py

      - name: Test secondary DEX extraction guards
        run: python3 tests/secondary-dex-unit.py

      - name: Test native library ABI and extraction safety
        run: python3 tests/native-libraries-unit.py

      - name: Test malformed binary manifest handling
        run: python3 tests/manifest-safety.py

      - name: Run framework lifecycle and event loop tests
        run: bash tests/framework-smoke.sh

      - name: Run APK inspection smoke test
        run: bash tests/apk-inspect-smoke.sh

      - name: Verify sandbox cannot fall back to unrestricted ART
        run: bash tests/sandbox-smoke.sh

      - name: Verify sandbox helper drops host environment and file descriptors
        run: python3 tests/sandbox-launcher-smoke.py

      - name: Verify sandbox wall-clock timeout, cleanup and fail-closed CLI validation
        run: python3 tests/sandbox-timeout-smoke.py

  wayland-backend:
    name: Native Wayland compile and headless GUI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install GTK4 and a headless Wayland compositor
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config weston sway jq dbus-user-session libwayland-dev
      - name: Compile native Wayland backend
        run: bash scripts/build-wayland.sh
      - name: Verify Java click and repaint protocol
        run: bash tests/gui-protocol-smoke.sh
      - name: Verify delayed Handler callback and GUI repaint
        run: bash tests/gui-timer-smoke.sh
      - name: Verify Wayland window under Weston headless
        run: bash tests/wayland-headless.sh
      - name: Compile isolated wlroots virtual pointer helper
        run: bash scripts/build-virtual-pointer-test.sh
      - name: Verify compositor-delivered mouse click under headless Sway
        run: bash tests/wayland-sway-pointer.sh

  sandbox-kernel:
    name: Real Bubblewrap kernel namespace isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Probe unprivileged namespace support without weakening AppArmor
        run: |
          set +e
          python3 tests/sandbox-kernel.py
          status=$?
          set -e
          if [[ "$status" -eq 77 ]]; then
            echo "::warning::Ubuntu runner denies unprivileged Bubblewrap; ANX must fail closed in this environment."
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
      - name: Verify actual namespaces under privileged CI probe
        run: sudo -n python3 tests/sandbox-kernel.py
